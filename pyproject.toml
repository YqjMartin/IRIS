[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iris-edit-synthesis"
version = "0.1.0"
description = "Policy-evolving synthesis of instruction-guided image editing pairs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32,<3",
    "pydantic>=2.10,<3",
    "Pillow>=10,<13",
    "tqdm>=4.64,<5",
    "PyYAML>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["iris*"]

[tool.setuptools.package-data]
iris = ["configs/**/*.json", "configs/**/*.jsonl"]
